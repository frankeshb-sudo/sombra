# Compila el instalador de Sombra para Windows en los servidores de GitHub.
# - A mano: pestaña "Actions" → "Instalador de Windows" → "Run workflow".
# - Automático: en cada cambio subido a main y, al publicar una etiqueta de versión (por ejemplo v0.1.0) se crea
#   además una "Release" con el instalador para descargarlo desde tu web.
name: Instalador de Windows

on:
  workflow_dispatch:
  push:
    branches: [main]   # cada cambio subido a main: instalador nuevo (tools/actualizar-windows.ps1)
    tags: ["v*"]
    # Si solo cambian textos o herramientas, la app es la misma: no se compila.
    paths-ignore: ["**.md", "tools/**"]

# Si se suben dos cambios seguidos, solo se compila el último.
concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write   # solo para adjuntar el instalador a la Release

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Caché de compilación
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Compilar e instalador (NSIS)
        run: npx --yes @tauri-apps/cli@2 build --bundles nsis

      - name: Guardar el instalador
        uses: actions/upload-artifact@v4
        with:
          name: Sombra-Windows
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

      - name: Publicar en Releases (solo con etiqueta v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: src-tauri/target/release/bundle/nsis/*.exe
