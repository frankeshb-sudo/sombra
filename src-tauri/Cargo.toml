[package]
name = "sombra"
version = "0.1.0"
description = "Sombra: navegador ligero y privado, sin publicidad, con Tor integrado"
license = "GPL-3.0-or-later"
edition = "2021"
rust-version = "1.80"

[build-dependencies]
tauri-build = { version = "2.5", features = [] }

[dependencies]
tauri = { version = "2.12", features = ["unstable"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
arti-client = { version = "0.48", features = ["tokio", "rustls", "geoip", "experimental-api", "static-sqlite", "onion-service-client"] }
tor-rtcompat = { version = "0.48", features = ["tokio", "rustls"] }
adblock = { version = "0.13", default-features = false, features = ["full-regex-handling", "embedded-domain-resolver"] }
axum = "0.8"
rand = "0.8"
hex = "0.4"
anyhow = "1"
url = "2"
log = "0.4"
env_logger = "0.11"
dirs = "5"
parking_lot = "0.12"
futures = "0.3"
argon2 = "0.5"
chacha20poly1305 = "0.10"
bip39 = { version = "2", features = ["spanish"] }
zeroize = "1"
psl = "2"

# Argon2 sin optimizar tarda varios segundos: se optimiza también en las pruebas.
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"

# Tauri con el parche de Sombra: las pestañas se crean sin ningún rastro de Tauri.
# Ver vendor/PARCHE.md (cómo actualizarlo) y tools/patch-tauri.py.
[patch.crates-io]
tauri = { path = "vendor/tauri" }
tauri-runtime-wry = { path = "vendor/tauri-runtime-wry" }
